[pytest]
# Pytest configuration for MLOps Events API tests

# Test discovery
testpaths = tests
python_files = test_*.py test_*_integration.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Markers (registered in conftest.py)
markers =
    unit: Unit tests with mocked dependencies (fast)
    integration: Integration tests with real resources (slow)
    slow: Slow-running tests (agent queries, etc)

# Coverage options (for unit tests only)
[coverage:run]
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
